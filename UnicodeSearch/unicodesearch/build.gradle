apply plugin: 'com.android.library'

android {
//    namespace "org.jaya.unicodesearch"
    compileSdkVersion 33
//    buildToolsVersion '30.0.3'

    sourceSets {
        main {
            java {
                exclude '**/test/**'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.apache.lucene:lucene-core:4.7.2'
    implementation 'org.apache.lucene:lucene-analyzers-common:4.7.2'
    implementation 'org.apache.lucene:lucene-queryparser:4.7.2'
//    implementation group: 'org.apache.lucene', name: 'lucene-core', version: '4.7.2'
//    implementation group: 'org.apache.lucene', name: 'lucene-analyzers-common', version: '4.7.2'
//    implementation group: 'org.apache.lucene', name: 'lucene-queryparser', version: '4.7.2'
    // https://mvnrepository.com/artifact/com.googlecode.json-simple/json-simple
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'
    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.8'

    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.12'
}

