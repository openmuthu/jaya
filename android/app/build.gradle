apply plugin: 'com.android.application'

android {
    namespace "org.jaya"
    signingConfigs {
//    debug {
//        storeFile file('heavy/p/jaya/jaya.p12')
//        storePassword storePassword
//        keyAlias 'key0'
//        keyPassword keyPassword
//    }
    }
    compileSdkVersion 35
    compileSdk 35
    defaultConfig {
        applicationId "org.jaya"
        minSdkVersion 14
        targetSdkVersion 35
        versionCode 10
        versionName "10.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
//        jackOptions {
//            enabled true
//        }
    }

//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
//    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'org.jaya.android'
//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
//    }
//    buildToolsVersion '30.0.3'
//    namespace 'org.jaya.android'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':unicodesearch')
    androidTestImplementation(
            'com.android.support.test.espresso:espresso-core:2.2',
            {
                exclude group: 'com.android.support', module: 'support-annotations'
            }
    )
    implementation 'com.android.support:appcompat-v7:23.4.0'
    implementation 'com.android.support:support-vector-drawable:23.4.0'
    implementation 'org.hamcrest:hamcrest-core:1.3'
    implementation 'junit:junit:4.12'
//    compile 'testfairy:testfairy-android-sdk:1.+@aar'

    // These dependencies are taken from unicodesearch project's build.gradle dependencies
    // For some reason, implementation project(':unicodesearch') doesn't seem to be working
    implementation 'org.apache.lucene:lucene-core:4.7.2'
    implementation 'org.apache.lucene:lucene-analyzers-common:4.7.2'
    implementation 'org.apache.lucene:lucene-queryparser:4.7.2'
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.8'
}
